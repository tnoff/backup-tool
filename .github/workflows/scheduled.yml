name: Scheduled

# Replaces the GitLab weekly pipeline schedule, deactivated in terraform!257.
# Same cron terraform derived for it, so the cadence is unchanged.

on:
  schedule:
    - cron: '12 14 * * 4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    name: Renovate
    uses: tnoff/github-workflows/.github/workflows/renovate.yml@5dca8145085b355530ca629398369aa4a0219250
    secrets:
      app_id: ${{ secrets.CI_APP_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  branch-cleanup:
    name: Branch cleanup
    permissions:
      contents: write
      pull-requests: read
    uses: tnoff/github-workflows/.github/workflows/branch-cleanup.yml@5dca8145085b355530ca629398369aa4a0219250
    with:
      age_days: 30
      dry_run: false
